  <path class="edge" d="M1640 1325H1810"/><text class="label" x="1690" y="1310">recuperações</text>
  <path class="auditEdge" d="M1640 1265H2150V890"/><text class="label" x="1910" y="1250">eventos</text>

  <!-- Catálogo de exames -->
  <g transform="translate(60 190)"><rect class="exam" width="300" height="170" rx="11"/><rect class="headExam" width="300" height="43" rx="11"/><text class="title" x="18" y="28">EXAMECATEGORIAS</text><text class="key" x="18" y="74">PK  idexamecategoria</text><text class="field" x="18" y="103">nmcategoria · stativo</text><text class="muted" x="18" y="132">idusuarioinclusao · idusuarioalteracao</text><text class="muted" x="18" y="153">dhinclusao · dhalteracao</text></g>
  <g transform="translate(440 190)"><rect class="exam" width="320" height="230" rx="11"/><rect class="headExam" width="320" height="43" rx="11"/><text class="title" x="18" y="28">EXAMES</text><text class="key" x="18" y="74">PK  idexame</text><text class="fk" x="18" y="101">FK  idexamecategoria</text><text class="fk" x="18" y="128">FK  idexamepai → exames</text><text class="field" x="18" y="155">cdexame · nmexame</text><text class="field" x="18" y="182">qttotalexames · vlexame</text><text class="muted" x="18" y="209">stprimario · stativo · auditoria</text></g>
  <g transform="translate(60 455)"><rect class="exam" width="300" height="180" rx="11"/><rect class="headExam" width="300" height="43" rx="11"/><text class="title" x="18" y="28">ANALITOS</text><text class="key" x="18" y="74">PK  idanalito</text><text class="field" x="18" y="103">cdanalito · nmanalito</text><text class="field" x="18" y="130">dstecnica · dsunidademedida</text><text class="muted" x="18" y="157">tpvalor · fgpercentual · stativo</text></g>
  <g transform="translate(410 455)"><rect class="exam" width="300" height="175" rx="11"/><rect class="headExam" width="300" height="43" rx="11"/><text class="title" x="18" y="28">ANIMALGRUPOS</text><text class="key" x="18" y="74">PK  idanimalgrupo</text><text class="fk" x="18" y="101">FK  idanimalgrupopai → animalgrupos</text><text class="field" x="18" y="128">nmtipoanimal · dsdescricao</text><text class="muted" x="18" y="155">stativo · auditoria</text></g>
  <g transform="translate(870 510)"><rect class="exam" width="300" height="175" rx="11"/><rect class="headExam" width="300" height="43" rx="11"/><text class="title" x="18" y="28">EXAMEANALITOS</text><text class="key" x="18" y="74">PK  idexameanalito</text><text class="fk" x="18" y="101">FK  idexame → exames</text><text class="fk" x="18" y="128">FK  idanalito → analitos</text><text class="muted" x="18" y="155">stativo · auditoria</text></g>
  <g transform="translate(790 735)"><rect class="exam" width="330" height="235" rx="11"/><rect class="headExam" width="330" height="43" rx="11"/><text class="title" x="18" y="28">MODELOEXAMES</text><text class="key" x="18" y="74">PK  idmodeloexame</text><text class="fk" x="18" y="101">FK  idexame → exames</text><text class="fk" x="18" y="128">FK  idanimalgrupo → animalgrupos</text><text class="field" x="18" y="155">cdmodelolaudo · nmmodelolaudo</text><text class="field" x="18" y="182">dsfaixaidade · nmarquivoorigem</text><text class="muted" x="18" y="209">stativo · auditoria</text></g>
  <g transform="translate(1230 1050)"><rect class="exam" width="350" height="255" rx="11"/><rect class="headExam" width="350" height="43" rx="11"/><text class="title" x="18" y="28">MODELOEXAMEANALITOS</text><text class="key" x="18" y="74">PK  idmodeloexameanalito</text><text class="fk" x="18" y="101">FK  idmodeloexame → modeloexames</text><text class="fk" x="18" y="128">FK  idexameanalito → exameanalitos</text><text class="field" x="18" y="155">dssecao · nrexibicao · dsrotulo</text><text class="field" x="18" y="182">técnica · unidade · referência</text><text class="field" x="18" y="209">vrrefmin/max · vrrefpermin/max</text><text class="muted" x="18" y="236">stativo · auditoria</text></g>

  <!-- Pessoas, autenticação e auditoria -->
  <g transform="translate(60 1125)"><rect class="people" width="340" height="150" rx="11"/><rect class="headPeople" width="340" height="43" rx="11"/><text class="title" x="18" y="28">PESSOAATIVIDADE</text><text class="key" x="18" y="74">PK  idpessoaatividade</text><text class="field" x="18" y="103">dspessoaatividade</text></g>
  <g transform="translate(495 1125)"><rect class="people" width="335" height="220" rx="11"/><rect class="headPeople" width="335" height="43" rx="11"/><text class="title" x="18" y="28">PESSOA</text><text class="key" x="18" y="74">PK  idpessoa</text><text class="fk" x="18" y="101">FK  idpessoaatividade</text><text class="field" x="18" y="128">nmpessoa · tppessoa · nrpessoa</text><text class="field" x="18" y="155">endereço · cidade · UF · CEP</text><text class="muted" x="18" y="182">stativo · datas de auditoria</text></g>
  <g transform="translate(915 1320)"><rect class="people" width="305" height="160" rx="11"/><rect class="headPeople" width="305" height="43" rx="11"/><text class="title" x="18" y="28">PESSOACONTATO</text><text class="key" x="18" y="74">PK  idpessoacontato</text><text class="fk" x="18" y="101">FK  idpessoa · idtipocontato</text><text class="field" x="18" y="128">dscontato · dsrotulo · stativo</text></g>
  <g transform="translate(1200 1320)"><rect class="people" width="280" height="150" rx="11"/><rect class="headPeople" width="280" height="43" rx="11"/><text class="title" x="18" y="28">TIPOCONTATO</text><text class="key" x="18" y="74">PK  idtipocontato</text><text class="field" x="18" y="103">dstipocontato · dsurlbase</text></g>
  <g transform="translate(1500 1125)"><rect class="auth" width="225" height="180" rx="11"/><rect class="headAuth" width="225" height="43" rx="11"/><text class="title" x="18" y="28">USUARIO</text><text class="key" x="18" y="74">PK  idusuario</text><text class="fk" x="18" y="101">FK única idpessoa</text><text class="field" x="18" y="128">dsemail · dssenhahash</text><text class="muted" x="18" y="155">stativo · segurança</text></g>
  <g transform="translate(1810 1125)"><rect class="auth" width="300" height="180" rx="11"/><rect class="headAuth" width="300" height="43" rx="11"/><text class="title" x="18" y="28">SESSAO</text><text class="key" x="18" y="74">PK  idsessao</text><text class="fk" x="18" y="101">FK  idusuario</text><text class="field" x="18" y="128">dsrefreshhash · dhexpiracao</text><text class="muted" x="18" y="155">dhrevogacao · segurança</text></g>
  <g transform="translate(1810 1370)"><rect class="auth" width="300" height="155" rx="11"/><rect class="headAuth" width="300" height="43" rx="11"/><text class="title" x="18" y="28">RECUPERACAOSENHA</text><text class="key" x="18" y="74">PK  idrecuperacaosenha</text><text class="fk" x="18" y="101">FK  idusuario</text><text class="field" x="18" y="128">token hash · expiração · uso</text></g>
  <g transform="translate(2150 735)"><rect class="audit" width="300" height="205" rx="11"/><rect class="headAudit" width="300" height="43" rx="11"/><text class="title" x="18" y="28">AUDITORIAEVENTOS</text><text class="key" x="18" y="74">PK  idauditoriaevento</text><text class="fk" x="18" y="101">FK  idusuario (opcional)</text><text class="field" x="18" y="128">tpevento · tprecurso · cdrecurso</text><text class="field" x="18" y="155">cdrequisicao · dsdetalhes</text><text class="muted" x="18" y="182">dhocorrencia · imutável</text></g>

  <rect x="60" y="1500" width="1780" height="40" rx="10" fill="#17253a" stroke="#4a719e"/>
  <text class="legend" x="82" y="1526"><tspan class="key">PK</tspan><tspan> chave primária. </tspan><tspan class="fk">FK</tspan><tspan> chave estrangeira. Linhas tracejadas: auditoria. “auditoria” representa FKs de inclusão e alteração para USUARIO.</tspan></text>
</svg>
