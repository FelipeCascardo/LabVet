<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1550" viewBox="0 0 2500 1550" role="img" aria-labelledby="title description">
  <title id="title">Modelo entidade relacionamento do Labvet V1</title>
  <desc id="description">Diagrama ER do schema labvet após as migrations 001 a 011, com todas as tabelas de catálogo, pessoas, autenticação, modelos de exames e auditoria.</desc>
  <style>
    .bg{fill:#101827}.grid{stroke:#27364a;stroke-width:1}.edge{fill:none;stroke:#91a6bf;stroke-width:2}.auditEdge{fill:none;stroke:#d8ae60;stroke-width:2;stroke-dasharray:8 7}.box{fill:#17253a;stroke:#4a719e;stroke-width:2}.exam{fill:#15342f;stroke:#54a892;stroke-width:2}.people{fill:#182e4d;stroke:#5f9ee8;stroke-width:2}.auth{fill:#3b2d18;stroke:#c99a4c;stroke-width:2}.audit{fill:#38263f;stroke:#b97acb;stroke-width:2}.head{fill:#273c58}.headExam{fill:#205445}.headPeople{fill:#264a78}.headAuth{fill:#624719}.headAudit{fill:#623a70}.title{fill:#f6f8fb;font:700 19px Arial,sans-serif}.key{fill:#ffd36e;font:600 14px Arial,sans-serif}.fk{fill:#9fdaff;font:600 14px Arial,sans-serif}.field{fill:#d0d9e6;font:13px Arial,sans-serif}.muted{fill:#aebccd;font:12px Arial,sans-serif}.caption{fill:#f7f9fd;font:700 32px Arial,sans-serif}.sub{fill:#b8c5d7;font:16px Arial,sans-serif}.label{fill:#dce7f5;font:600 12px Arial,sans-serif}.legend{fill:#d8e1ed;font:14px Arial,sans-serif}
  </style>
  <rect class="bg" width="2500" height="1550"/>
  <g opacity=".38"><path class="grid" d="M0 100H2500M0 300H2500M0 500H2500M0 700H2500M0 900H2500M0 1100H2500M0 1300H2500M0 1500H2500"/><path class="grid" d="M100 0V1550M300 0V1550M500 0V1550M700 0V1550M900 0V1550M1100 0V1550M1300 0V1550M1500 0V1550M1700 0V1550M1900 0V1550M2100 0V1550M2300 0V1550"/></g>
  <text class="caption" x="60" y="55">Labvet V1 — modelo ER vigente</text>
  <text class="sub" x="60" y="84">Schema labvet após as migrations 001 a 011 · catálogo, pessoas, autenticação, modelos e auditoria</text>

  <!-- Relações de negócio -->
  <path class="edge" d="M360 315H440"/><text class="label" x="370" y="300">classifica</text>
  <path class="edge" d="M690 420V445H545V420"/><text class="label" x="600" y="438">pai</text>
  <path class="edge" d="M760 370H870V510"/><text class="label" x="775" y="393">exame</text>
  <path class="edge" d="M1170 585H1225"/><text class="label" x="1180" y="570">analito</text>
  <path class="edge" d="M1350 675V735"/><text class="label" x="1362" y="720">configura</text>
  <path class="edge" d="M690 430V685H960V735"/><text class="label" x="820" y="670">exame</text>
  <path class="edge" d="M710 625H800V735"/><text class="label" x="720" y="645">grupo</text>
  <path class="edge" d="M710 600V625H560V600"/><text class="label" x="605" y="618">pai</text>
  <path class="edge" d="M1120 970H1230V1050"/><text class="label" x="1135" y="995">modelo</text>
  <path class="edge" d="M1350 675V1020H1440V1050"/><text class="label" x="1360" y="1010">vínculo</text>
  <path class="edge" d="M400 1220H495"/><text class="label" x="410" y="1205">atividade</text>
  <path class="edge" d="M830 1315H915"/><text class="label" x="840" y="1300">pessoa</text>
